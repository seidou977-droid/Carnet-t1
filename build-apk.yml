name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le projet Android
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/fr/carnet/t1 app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/xml
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'FIN_FICHIER'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CarnetT1"
          include ':app'
          FIN_FICHIER
          cat > build.gradle <<'FIN_FICHIER'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIN_FICHIER
          cat > gradle.properties <<'FIN_FICHIER'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          FIN_FICHIER
          cat > app/build.gradle <<'FIN_FICHIER'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'fr.carnet.t1'
              compileSdk 34

              defaultConfig {
                  applicationId 'fr.carnet.t1'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          FIN_FICHIER
          cat > app/src/main/AndroidManifest.xml <<'FIN_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Uniquement pour charger la police d'affichage ; l'appli fonctionne hors ligne -->
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          FIN_FICHIER
          cat > app/src/main/res/xml/file_paths.xml <<'FIN_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="photos" path="photos/" />
              <cache-path name="exports" path="exports/" />
          </paths>
          FIN_FICHIER
          cat > app/src/main/res/values/strings.xml <<'FIN_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Carnet T1</string>
          </resources>
          FIN_FICHIER
          cat > app/src/main/res/values/colors.xml <<'FIN_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#2B8C6B</color>
          </resources>
          FIN_FICHIER
          cat > app/src/main/res/drawable/ic_fg.xml <<'FIN_FICHIER'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,30 C62,42 70,50 70,60 A16,16 0 0 1 38,60 C38,50 46,42 54,30 Z" />
          </vector>
          FIN_FICHIER
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'FIN_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          FIN_FICHIER
          cat > app/src/main/java/fr/carnet/t1/MainActivity.java <<'FIN_FICHIER'
          package fr.carnet.t1;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int FILE_REQUEST = 1;
              private WebView web;
              private ValueCallback<Uri[]> pendingFiles;
              private Uri cameraUri;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);   // IndexedDB : les données restent sur le téléphone
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);

                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (pendingFiles != null) pendingFiles.onReceiveValue(null);
                          pendingFiles = callback;
                          cameraUri = null;

                          Intent content = params.createIntent();
                          Intent chooser = content;

                          boolean wantsImage = false;
                          for (String t : params.getAcceptTypes()) {
                              if (t != null && t.startsWith("image")) wantsImage = true;
                          }
                          if (wantsImage) {
                              try {
                                  File dir = new File(getCacheDir(), "photos");
                                  dir.mkdirs();
                                  File photo = File.createTempFile("repas_", ".jpg", dir);
                                  cameraUri = FileProvider.getUriForFile(MainActivity.this,
                                          getPackageName() + ".files", photo);
                                  Intent camera = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                                  camera.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                                  camera.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                          | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  chooser = Intent.createChooser(content, "Photo du repas");
                                  chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{camera});
                              } catch (Exception e) {
                                  cameraUri = null;
                                  chooser = content;
                              }
                          }
                          try {
                              startActivityForResult(chooser, FILE_REQUEST);
                          } catch (Exception e) {
                              pendingFiles = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_REQUEST || pendingFiles == null) return;
                  Uri[] result = null;
                  if (resultCode == RESULT_OK) {
                      if (data != null && (data.getData() != null || data.getClipData() != null)) {
                          result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      } else if (cameraUri != null) {
                          result = new Uri[]{cameraUri};   // photo prise avec l'appareil
                      }
                  }
                  pendingFiles.onReceiveValue(result);
                  pendingFiles = null;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  // Le bouton retour ferme d'abord la fenêtre ouverte dans l'appli
                  web.evaluateJavascript(
                          "(function(){var b=document.getElementById('sheetbg');" +
                          "if(b){b.remove();document.body.style.overflow='';return 1;}return 0;})()",
                          value -> {
                              if (!"1".equals(value)) MainActivity.super.onBackPressed();
                          });
              }

              /** Pont JavaScript : export du carnet en CSV via le menu de partage Android. */
              private class Bridge {
                  @JavascriptInterface
                  public void shareFile(String name, String content) {
                      try {
                          File dir = new File(getCacheDir(), "exports");
                          dir.mkdirs();
                          String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                          File f = new File(dir, safe);
                          try (FileOutputStream out = new FileOutputStream(f)) {
                              out.write(content.getBytes(StandardCharsets.UTF_8));
                          }
                          Uri uri = FileProvider.getUriForFile(MainActivity.this,
                                  getPackageName() + ".files", f);
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType("text/csv");
                          send.putExtra(Intent.EXTRA_STREAM, uri);
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          runOnUiThread(() -> startActivity(Intent.createChooser(send, "Exporter le carnet")));
                      } catch (Exception ignored) { }
                  }
              }
          }
          FIN_FICHIER

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CarnetT1.apk

      - name: Publier l'APK dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" CarnetT1.apk \
            --title "Carnet T1 version ${{ github.run_number }}" \
            --notes "Téléchargez CarnetT1.apk sur votre téléphone pour l'installer."
